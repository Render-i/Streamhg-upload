<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>StreamHG - Upload Video from URL</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f9f9f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #007bff;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }
        #result {
            margin-top: 30px;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
        }
        .success { background: #d4edda; color: #155724; }
        .error   { background: #f8d7da; color: #721c24; }
        .info    { background: #e2e3e5; color: #383d41; }
        .note {
            font-size: 0.9em;
            color: #555;
            margin-top: -10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>Upload Video to StreamHG from URL</h1>

    <div class="form-group">
        <label for="apiKey">Your StreamHG API Key: <span style="color:red;">*</span></label>
        <input type="text" id="apiKey" placeholder="e.g. 45pnnxooi9wrxd5k5..." required />
    </div>

    <div class="form-group">
        <label for="videoUrl">Video URL (direct link): <span style="color:red;">*</span></label>
        <input type="text" id="videoUrl" placeholder="https://example.com/my-video.mp4" required />
    </div>

    <div class="form-group">
        <label for="fldId">Folder ID (fld_id) — optional:</label>
        <input type="number" id="fldId" placeholder="e.g. 25 or 123 (leave empty for root)" min="0" />
        <div class="note">Enter the numeric Folder ID to upload into a specific folder. Leave blank for default (root).</div>
    </div>

    <button id="uploadBtn">Start Upload</button>

    <div id="result"></div>

    <script>
        const btn = document.getElementById('uploadBtn');
        const resultDiv = document.getElementById('result');

        btn.addEventListener('click', async () => {
            const apiKey = document.getElementById('apiKey').value.trim();
            const url = document.getElementById('videoUrl').value.trim();
            const fldId = document.getElementById('fldId').value.trim();

            if (!apiKey) {
                showMessage('Please enter your API key.', 'error');
                return;
            }
            if (!url) {
                showMessage('Please enter a video URL.', 'error');
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                showMessage('Video URL should start with http:// or https://', 'error');
                return;
            }

            btn.disabled = true;
            showMessage('Sending request... Please wait.', 'info');

            try {
                const params = new URLSearchParams({
                    key: apiKey,
                    url: url
                });

                // Add fld_id only if provided and is a valid number
                if (fldId && !isNaN(fldId) && Number(fldId) >= 0) {
                    params.append('fld_id', fldId);
                }

                // Optional: you can easily add more later, example:
                // params.append('cat_id', '5');
                // params.append('file_public', '1');
                // params.append('file_adult', '0');
                // params.append('tags', 'funny,memes,2026');

                const apiUrl = `https://streamhgapi.com/api/upload/url?${params.toString()}`;

                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.status === 200 && data.msg === "OK" && data.result?.filecode) {
                    showMessage(
                        `Success! Filecode: ${data.result.filecode}\n\n` +
                        `Video is now processing on StreamHG.\n` +
                        `Watch link (once ready): https://streamhg.com/${data.result.filecode}`,
                        'success'
                    );
                } else {
                    showMessage(
                        `API Error:\n` +
                        `Status: ${data.status || 'unknown'}\n` +
                        `Message: ${data.msg || 'No message provided'}\n\n` +
                        `Full response:\n${JSON.stringify(data, null, 2)}`,
                        'error'
                    );
                }
            } catch (err) {
                showMessage(`Network or fetch error: ${err.message}`, 'error');
            } finally {
                btn.disabled = false;
            }
        });

        function showMessage(text, type = 'info') {
            resultDiv.textContent = text;
            resultDiv.className = type;
        }
    </script>

</body>
</html>
