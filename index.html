<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>StreamHG - Upload Video from URL (with Subfolders)</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f9f9f9;
        }
        h1 { text-align: center; color: #333; }
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"], select {
            width: 100%;
            padding: 10px 36px 10px 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .clear-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 20px;
            color: #777;
            cursor: pointer;
            padding: 0 6px;
            line-height: 1;
            display: none;
        }
        .clear-btn:hover { color: #333; }
        button {
            background: #007bff;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #aaa; cursor: not-allowed; }
        #loadFoldersBtn { background: #28a745; }
        #loadFoldersBtn:hover { background: #218838; }
        #result {
            margin-top: 30px;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
        }
        .success { background: #d4edda; color: #155724; }
        .error   { background: #f8d7da; color: #721c24; }
        .info    { background: #e2e3e5; color: #383d41; }
        small.note { display: block; margin-top: 6px; color: #666; font-size: 0.9em; }
        #folderSelect { padding-right: 12px; }
        option.level-1 { padding-left: 15px; }
        option.level-2 { padding-left: 30px; }
        option.level-3 { padding-left: 45px; }
        option.level-4 { padding-left: 60px; }
        option.level-5 { padding-left: 75px; }
    </style>
</head>
<body>

    <h1>Upload Video to StreamHG from URL (with Subfolders)</h1>

    <div class="form-group">
        <label for="apiKey">Your StreamHG API Key:</label>
        <input type="text" id="apiKey" placeholder="e.g. 45pnnxooi9wrxd5k5..." />
    </div>

    <div class="form-group">
        <label for="videoUrl">Video URL (direct link):</label>
        <input type="text" id="videoUrl" placeholder="https://example.com/my-video.mp4" />
        <button type="button" class="clear-btn" id="clearUrl">×</button>
    </div>

    <div class="form-group">
        <label>Folder Selection:</label>
        <button id="loadFoldersBtn">Load Folders (incl. subfolders)</button>
        <small class="note">Fetches root + subfolders (up to 5 levels deep)</small>
    </div>

    <div class="form-group" id="folderSelectGroup" style="display:none;">
        <label for="folderSelect">Select Folder:</label>
        <select id="folderSelect">
            <option value="0">Root / Default (ID: 0)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="folderId">Folder ID (fld_id) – auto-filled from selection:</label>
        <input type="text" id="folderId" placeholder="e.g. 25" value="0" />
        <small class="note">0 = root folder</small>
    </div>

    <button id="uploadBtn">Start Upload</button>

    <div id="result"></div>

    <script>
        const apiKeyInput    = document.getElementById('apiKey');
        const urlInput       = document.getElementById('videoUrl');
        const clearBtn       = document.getElementById('clearUrl');
        const loadFoldersBtn = document.getElementById('loadFoldersBtn');
        const folderSelect   = document.getElementById('folderSelect');
        const folderSelectGroup = document.getElementById('folderSelectGroup');
        const folderInput    = document.getElementById('folderId');
        const uploadBtn      = document.getElementById('uploadBtn');
        const resultDiv      = document.getElementById('result');

        const MAX_DEPTH = 5; // safety limit to prevent infinite recursion

        // Clear URL button
        urlInput.addEventListener('input', () => {
            clearBtn.style.display = urlInput.value.trim() ? 'block' : 'none';
        });
        clearBtn.addEventListener('click', () => {
            urlInput.value = '';
            clearBtn.style.display = 'none';
            urlInput.focus();
        });

        // Sync dropdown → text input
        folderSelect.addEventListener('change', () => {
            folderInput.value = folderSelect.value;
        });

        // Sync text → dropdown (if manual edit)
        folderInput.addEventListener('input', () => {
            const val = folderInput.value.trim();
            if (/^\d+$/.test(val) && folderSelect.querySelector(`option[value="${val}"]`)) {
                folderSelect.value = val;
            } else {
                folderSelect.value = '0';
            }
        });

        // Recursive folder fetch
        async function fetchFoldersRecursively(parentId = 0, depth = 0, prefix = '') {
            if (depth > MAX_DEPTH) return [];

            const key = apiKeyInput.value.trim();
            const params = new URLSearchParams({ key, fld_id: parentId, files: 0 });
            const url = `https://streamhgapi.com/api/folder/list?${params}`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (data.status !== 200 || data.msg !== "OK" || !data.result?.folders) {
                    return [];
                }

                const folders = data.result.folders || [];
                let allFolders = [];

                for (const folder of folders) {
                    const name = folder.name || 'Unnamed';
                    const id   = folder.fld_id;
                    const indent = prefix ? prefix + '→ ' : '';
                    const displayName = indent + name + ` (ID: ${id})`;

                    const option = document.createElement('option');
                    option.value = id;
                    option.textContent = displayName;
                    option.className = `level-${depth + 1}`;
                    allFolders.push(option);

                    // Recurse into subfolders
                    const subFolders = await fetchFoldersRecursively(id, depth + 1, indent);
                    allFolders = allFolders.concat(subFolders);
                }

                return allFolders;
            } catch (err) {
                console.error('Fetch error at depth', depth, err);
                return [];
            }
        }

        // Load folders button
        loadFoldersBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) return showMessage('Enter your API key first.', 'error');

            loadFoldersBtn.disabled = true;
            loadFoldersBtn.textContent = 'Loading folders...';
            showMessage('Fetching folder structure (may take a moment for deep nesting)...', 'info');

            try {
                folderSelect.innerHTML = '<option value="0">Root / Default (ID: 0)</option>';

                const subOptions = await fetchFoldersRecursively(0, 0, '');

                subOptions.forEach(opt => folderSelect.appendChild(opt));

                folderSelectGroup.style.display = 'block';
                showMessage(`Loaded folders (including subfolders). Select one below.`, 'success');
            } catch (err) {
                showMessage(`Error loading folders: ${err.message}`, 'error');
            } finally {
                loadFoldersBtn.disabled = false;
                loadFoldersBtn.textContent = 'Load Folders (incl. subfolders)';
            }
        });

        // Upload (same as before)
        uploadBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const url    = urlInput.value.trim();
            let   fldId  = folderInput.value.trim();

            if (!apiKey) return showMessage('Please enter your API key.', 'error');
            if (!url)    return showMessage('Please enter a video URL.', 'error');
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                return showMessage('Video URL must start with http(s)://', 'error');
            }
            if (!/^\d+$/.test(fldId)) {
                return showMessage('Folder ID must be a number.', 'error');
            }

            uploadBtn.disabled = true;
            showMessage('Uploading...', 'info');

            try {
                const params = new URLSearchParams({ key: apiKey, url });
                if (fldId !== '0') params.append('fld_id', fldId);

                const apiUrl = `https://streamhgapi.com/api/upload/url?${params}`;
                const res = await fetch(apiUrl);
                const data = await res.json();

                if (data.status === 200 && data.msg === "OK" && data.result?.filecode) {
                    showMessage(
                        `Success! Filecode: ${data.result.filecode}\n\n` +
                        `Watch link (after processing): https://streamhg.com/${data.result.filecode}`,
                        'success'
                    );
                } else {
                    showMessage(
                        `API Error: ${data.msg || 'Unknown'}\nStatus: ${data.status || '?'}`,
                        'error'
                    );
                }
            } catch (err) {
                showMessage(`Network error: ${err.message}`, 'error');
            } finally {
                uploadBtn.disabled = false;
            }
        });

        function showMessage(text, type = 'info') {
            resultDiv.textContent = text;
            resultDiv.className = type;
        }

        if (urlInput.value.trim()) clearBtn.style.display = 'block';
    </script>

</body>
    </html>
